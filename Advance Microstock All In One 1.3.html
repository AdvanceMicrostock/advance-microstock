<style>
:root{--bg:#070b13;--p:#0e1423;--p2:#121a2d;--l:#252f4b;--t:#f6f3ec;--m:#aab4c9;--gold:#d6a85a;--gold2:#f0cf8e;--gold3:#b8863a;--ok:#3ddc9c;--bad:#ff7a93}
*{box-sizing:border-box}html{color-scheme:dark}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;font:14px/1.45 Inter,system-ui,'Segoe UI',sans-serif;color:var(--t);background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.app{display:flex;align-items:center;gap:18px;padding:9px 22px;border-bottom:1px solid rgba(214,168,90,.2);background:linear-gradient(180deg,#0c121f,#070b13);flex:none;flex-wrap:wrap;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:19px;line-height:1.05;letter-spacing:.01em;white-space:nowrap}
.brand b{background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--m);letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
.logo{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 2px rgba(214,168,90,.45),0 6px 20px rgba(214,168,90,.25)}
.nav{display:inline-flex;gap:4px;padding:4px;background:var(--p);border:1px solid var(--l);border-radius:14px}
.nav button{border:0;background:transparent;border-radius:10px;padding:9px 18px;font-weight:800;color:var(--m);transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.nav button:hover{color:var(--t)}
.nav button[aria-selected=true]{background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--gold3));color:#080f13}
.nav kbd{font:700 10px/1 inherit;opacity:.55;border:1px solid currentColor;border-radius:5px;padding:2px 5px}
.sp{flex:1}
.safe{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(61,220,156,.4);background:rgba(61,220,156,.08);color:var(--ok);border-radius:11px;padding:7px 12px;font-weight:700;font-size:12px;white-space:nowrap}
#stage{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0}
.view iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
.ld{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;color:var(--m);font-weight:700;background:var(--bg);z-index:1}
.ld i{width:34px;height:34px;border-radius:50%;border:3px solid rgba(214,168,90,.25);border-top-color:var(--gold);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
@media(max-width:820px){.app{padding:9px 12px;gap:10px}.safe{display:none}.nav{order:3;width:100%;overflow-x:auto}.nav button{flex:1;justify-content:center;padding:9px 10px}.nav kbd,.nav .lg{display:none}.nav button{padding:9px 6px;font-size:12px;gap:4px}.nav svg{width:14px;height:14px}}
@media(prefers-reduced-motion:reduce){.ld i{animation:none}}
/* ===== Events calendar ===== */
#v-events{overflow:auto;background:radial-gradient(900px 400px at 85% -10%,rgba(214,168,90,.10),transparent),var(--bg)}
.ev{max-width:1320px;margin:0 auto;padding:22px 22px 40px;display:grid;gap:16px}
.ev h2{margin:0;font-size:22px;letter-spacing:.01em}
.ev .sub{color:var(--m);font-size:13px;margin-top:3px}
.ev-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--p);border:1px solid var(--l);border-radius:16px;padding:12px}
.ev-bar select,.ev-bar input{background:var(--p2);color:var(--t);border:1px solid var(--l);border-radius:10px;padding:9px 12px;font:inherit}
.ev-bar input{flex:1;min-width:160px}
.seg{display:inline-flex;background:var(--p2);border:1px solid var(--l);border-radius:10px;padding:3px;gap:2px}

etadata<\/small><\/span><\/div><div class=\"sp\"><\/div><span class=\"safe\" title=\"Everything runs in your browser. Files are never uploaded.\">🔒 Runs on your PC — nothing is uploaded<\/span><\/div>\n<main>\n<div class=\"seg\" role=\"tablist\"><button class=\"sg\" role=\"tab\" id=\"tC\" aria-selected=\"true\">⇄ Convert &amp; resize<\/button><button class=\"sg\" role=\"tab\" id=\"tM\" aria-selected=\"false\">🧹 Clean metadata<\/button><\/div>\n\n<section id=\"pC\"><div class=\"grid2\">\n<aside class=\"panel side\"><div class=\"ph\"><h3>⚙ Output settings<\/h3><\/div>\n<div class=\"fld\"><div class=\"lb\">Format<\/div><div class=\"pills\" id=\"fmtPills\"><\/div><div id=\"jextW\" hidden style=\"margin-top:10px\"><label for=\"jext\" style=\"display:flex;gap:10px;justify-content:space-between;font-weight:700;font-size:12.5px;color:var(--m);margin-bottom:7px\">File extension<\/label><select id=\"jext\"><option value=\"jpg\">.jpg<\/option><option value=\"jpeg\">.jpeg<\/option><option value=\"jfif\">.jfif<\/option><\/select><\/div><small class=\"hint\" id=\"fmtHint\"><\/small><small class=\"hint\">HEIC and HEIF can be opened, but not saved: no browser can write them. *AVIF only where the browser supports it.<\/small><\/div>\n<div class=\"fld\"><label for=\"q\">Quality <b id=\"qv\">90<\/b><\/label><input type=\"range\" id=\"q\" min=\"20\" max=\"100\" value=\"90\"><\/div>\n<div class=\"fld\"><label for=\"rm\">Resize<\/label><div class=\"two\"><select id=\"rm\"><option value=\"none\">Keep original size<\/option><option value=\"long\">Longest side<\/option><option value=\"w\">Width<\/option><option value=\"h\">Height<\/option><option value=\"pct\">Percent<\/option><option value=\"custom\">Custom size (W × H)<\/option><\/select><input type=\"number\" id=\"rv\" min=\"1\" value=\"2000\" aria-label=\"Resize value\"><\/div><div id=\"cust\" hidden><div class=\"whrow\"><input type=\"number\" id=\"cw\" min=\"1\" max=\"20000\" placeholder=\"Width px\" aria-label=\"Width in pixels\"><span>×<\/span><input type=\"number\" id=\"ch\" min=\"1\" max=\"20000\" placeholder=\"Height px\" aria-label=\"Height in pixels\"><\/div><select id=\"cfit\" aria-label=\"How to fit\"><option value=\"inside\">Fit inside — keep proportions<\/option><option value=\"fill\">Fill — crop the edges<\/option><option value=\"stretch\">Stretch to exact size<\/option><\/select><small class=\"hint\">Fill one box to keep proportions, or both for an exact size.<\/small><\/div><\/div><div class=\"fld\"><label for=\"tsz\">Maximum file size <b>optional<\/b><\/label><div class=\"two\"><input type=\"number\" id=\"tsz\" min=\"1\" step=\"any\" placeholder=\"No limit\" aria-label=\"Maximum file size\"><select id=\"tsu\" aria-label=\"Unit\"><option value=\"KB\">KB<\/option><option value=\"MB\">MB<\/option><\/select><\/div><small class=\"hint\">Quality is lowered automatically until the file fits, then the size if needed. PNG, BMP and TIFF shrink the size instead.<\/small><\/div>\n<label class=\"chk\" id=\"upW\"><input type=\"checkbox\" id=\"up\"><span>Allow enlarging<small>Off = small images are never scaled up<\/small><\/span><\/label>\n<div class=\"fld\" id=\"bgW\"><label for=\"bg\">Background for transparent areas <b>JPG · BMP · TIFF<\/b><\/label><div class=\"bgrow\"><input type=\"color\" id=\"bg\" value=\"#ffffff\"><button class=\"btn\" type=\"button\" data-bg=\"#ffffff\">White<\/button><button class=\"btn\" type=\"button\" data-bg=\"#000000\">Black<\/button><\/div><\/div>\n<div class=\"fld\"><label for=\"sfx\">Add to file name<\/label><input type=\"text\" id=\"sfx\" placeholder=\"Leave empty to keep the name\" maxlength=\"40\"><\/div>\n<div class=\"auto\"><div class=\"lb2\">Automation<\/div><label class=\"chk\"><input type=\"checkbox\" id=\"aC\"><span>Convert as soon as files are added<small>No need to press Convert all<\/small><\/span><\/label><label class=\"chk\"><input type=\"checkbox\" id=\"zC\"><span>Download automatically when done<small>Several files become one ZIP. A single file is saved as it is.<\/small><\/span><\/label><\/div><p class=\"note\">Converting redraws the picture, so camera, GPS and text metadata are not carried over. To clean a file without touching its pixels, use the Clean metadata tab.<\/p><\/aside>\n<div>\n<label class=\"drop\" id=\"dzC\"><input type=\"file\" id=\"fC\" accept=\"image/*,.heic,.heif,.hif,.jfif,.avif\" multiple hidden><div style=\"font-size:34px\">🖼<\/div><div class=\"big\">Drop images or <b>click to browse<\/b><\/div><p>Drop them anywhere on this page. Ctrl+V works too.<\/p><div class=\"fm\"><b class=\"fl\">Open<\/b><i>JPG<\/i><i>JPEG<\/i><i>JFIF<\/i><i>PNG<\/i><i>WebP<\/i><i>GIF<\/i><i>BMP<\/i><i>AVIF<\/i><i>SVG<\/i><i>HEIC<\/i><i>HEIF<\/i><\/div><div class=\"fm\"><b class=\"fl\">Save as<\/b><i>JPG<\/i><i>JPEG<\/i><i>JFIF<\/i><i>PNG<\/i><i>WebP<\/i><i>GIF<\/i><i>BMP<\/i><i>TIFF<\/i><i>SVG<\/i><i>AVIF*<\/i><\/div><\/label>\n<div class=\"bar\"><button class=\"btn b-gold\" id=\"cGo\" disabled><span id=\"cGoT\">⇄ Convert all<\/span><b class=\"nb\" id=\"cGoN\">0<\/b><\/button><button class=\"btn b-green\" id=\"cZip\" disabled><span>⭳ Download ZIP<\/span><b class=\"nb nb-g\" id=\"cZipN\">0<\/b><\/button><button class=\"btn b-red\" id=\"cClr\" disabled><span>🗑 Clear<\/span><b class=\"nb nb-r\" id=\"cClrN\">0<\/b><\/button><span class=\"sp\"><\/span><span class=\"sum\" id=\"cSum\"><\/span><\/div>\n<div class=\"list\" id=\"cList\"><div class=\"empty\">No images yet. Add some above, choose a format, then press Convert all.<\/div><\/div>\n<\/div><\/div><\/section>\n\n<section id=\"pM\" hidden><div class=\"grid2\">\n<aside class=\"panel side\"><div class=\"ph\"><h3>🧹 Cleaning options<\/h3><\/div>\n<label class=\"chk\"><input type=\"checkbox\" id=\"kO\" checked><span>Keep rotation<small>Photos taken sideways stay upright<\/small><\/span><\/label>\n<label class=\"chk\"><input type=\"checkbox\" id=\"kI\" checked><span>Keep colour profile<small>Colours look the same after cleaning<\/small><\/span><\/label>\n<div class=\"auto\"><div class=\"lb2\">Automation<\/div><label class=\"chk\"><input type=\"checkbox\" id=\"aM\"><span>Clean as soon as files are added<small>No need to press Clean all<\/small><\/span><\/label><label class=\"chk\"><input type=\"checkbox\" id=\"zM\"><span>Download automatically when done<small>Several files become one ZIP. A single file is saved as it is.<\/small><\/span><\/label><\/div><div class=\"fld\"><label for=\"msfx\">Add to file name<\/label><input type=\"text\" id=\"msfx\" value=\"-clean\" maxlength=\"40\"><\/div>\n<p class=\"note\">JPG, PNG and WebP are cleaned directly in the file, so the picture is not re-encoded and quality stays exactly the same. Hidden data stored after the picture (second images, video) is removed too. Other formats can be cleaned with the Convert tab.<\/p><\/aside>\n<div>\n<label class=\"drop\" id=\"dzM\"><input type=\"file\" id=\"fM\" accept=\"image/jpeg,image/png,image/webp,.jfif\" multiple hidden><div style=\"font-size:34px\">🧹<\/div><div class=\"big\">Drop photos to <b>see what they reveal<\/b><\/div><p>Drop them anywhere on this page. Location, camera, dates and hidden text are listed before anything is removed.<\/p><div class=\"fm\"><i>JPG<\/i><i>PNG<\/i><i>WebP<\/i><\/div><\/label>\n<div class=\"bar\"><button class=\"btn b-gold\" id=\"mGo\" disabled><span id=\"mGoT\">🧹 Clean all<\/span><b class=\"nb\" id=\"mGoN\">0<\/b><\/button><button class=\"btn b-green\" id=\"mZip\" disabled><span>⭳ Download ZIP<\/span><b class=\"nb nb-g\" id=\"mZipN\">0<\/b><\/button><button class=\"btn b-red\" id=\"mClr\" disabled><span>🗑 Clear<\/span><b class=\"nb nb-r\" id=\"mClrN\">0<\/b><\/button><span class=\"sp\"><\/span><span class=\"sum\" id=\"mSum\"><\/span><\/div>\n<div class=\"list\" id=\"mList\"><div class=\"empty\">No photos yet. Add some above to inspect their metadata.<\/div><\/div>\n<\/div><\/div><\/section>\n<\/main>\n<footer>© Advance Microstock · Image Studio<\/footer><div id=\"dz\"><div><div class=\"dzi\">⇧<\/div><b>Drop to add<\/b>< /* ===== v4 tweaks injected into the tool frames ===== */
const LUX=`@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap');

:root{--bg:#070b13;--p:#0e1423;--p2:#121a2d;--l:#252f4b;--t:#f6f3ec;--m:#aab4c9;--gold:#d6a85a;--gold2:#f0cf8e;--gold3:#b8863a;--ok:#3ddc9c;--bad:#ff7a93}
body{font-family:Inter,system-ui,sans-serif!important;background:radial-gradient(900px 500px at 85% -10%,rgba(214,168,90,.10),transparent),#070b13!important}
.brand,.ph h3,.ev h2,.head{font-family:"Space Grotesk",Inter,sans-serif}
.panel,.card,.st,.dlg,.bp-st,.tk,.mc{background:#0e1423!important;border:1px solid #252f4b!important;border-radius:14px;box-shadow:inset 0 1px rgba(255,255,255,.02)!important}
.card{background:#121a2d!important}
.panel:hover,.st:hover{border-color:#35446b!important;box-shadow:inset 0 1px rgba(255,255,255,.02)!important}
.card:hover{border-color:rgba(214,168,90,.55)!important}
.card::before,.card::after{display:none!important}
.panel.side,.ev-side{background:#0a101c!important;border-radius:0!important;border:0!important;border-right:1px solid rgba(214,168,90,.2)!important}
.mb{background:#101627!important}
.btn,.mini-btn{border:1px solid #35446b;background:#141c2c;color:#e3e8f1;font-weight:800;box-shadow:none}
.btn:not([class*="b-"]):not(.g){background:#141c2c!important;border-color:#35446b!important;color:#e3e8f1!important;box-shadow:none!important}

.btn.b-gold,.btn.b-blue,.b-gold,.b-blue,.btn.g{background:linear-gradient(120deg,#f6dca0,#d6a85a)!important;border:0!important;color:#1a1204!important;font-weight:900;box-shadow:0 6px 20px rgba(214,168,90,.22)!important}
.btn.b-gold:hover:not(:disabled),.btn.b-blue:hover:not(:disabled),.btn.g:hover{filter:brightness(1.08);background:linear-gradient(120deg,#f6dca0,#d6a85a)!important}
.btn.b-green{background:rgba(38,230,163,.07)!important;border:1px solid rgba(38,230,163,.34)!important;color:#3ddc9c!important;box-shadow:none!important}
.btn.b-red{background:rgba(255,85,118,.08)!important;border:1px solid rgba(255,85,118,.4)!important;color:#ff9daf!important;box-shadow:none!important}
.btn.b-save{background:rgba(214,168,90,.1)!important;border:1px solid rgba(214,168,90,.55)!important;color:#f0cf8e!important;box-shadow:none!important}
.btn.b-pur{background:#e3e8f1!important;border:0!important;color:#121a2d!important}
.pl input:checked+span,.sg[aria-selected=true],.cc button[aria-pressed=true],.seg button[aria-pressed=true],.nav button[aria-selected=true]{background:linear-gradient(135deg,#f6dca0,#d6a85a)!important;color:#1a1204!important;border-color:transparent!important;box-shadow:0 3px 12px rgba(214,168,90,.3)!important}
.pl span{background:#0b1220!important;border:1px solid #35446b!important;color:#e3e8f1!important;box-shadow:none!important}
.pl span:hover{border-color:#f0cf8e!important;box-shadow:none!important}
.pl input:checked+span{border-color:transparent!important}
.nb{background:#1a1204;color:#f6dca0;box-shadow:none}
.nb-g{background:rgba(3,38,27,.8);color:#9af3d0}.nb-r{background:rgba(60,12,24,.7);color:#ff9daf}
.fld>label,.fld>.lb{color:#e3e8f1!important;text-transform:none!important;letter-spacing:0!important;font-size:12px!important;font-weight:800}

.ph h3,.panel>h3{color:#f0cf8e!important;text-shadow:none!important;font-size:12px!important;letter-spacing:.12em;text-transform:uppercase;font-weight:900}
.ev-sh,.lbl,.lb2,.auto .lb2{color:#f0cf8e!important;text-shadow:none!important}
.chk,.auto{background:#0b101c!important;border:1px solid #252f4b!important;box-shadow:none!important}
.chk:hover{border-color:#35446b!important;box-shadow:none!important}
.chk:has(input:checked){background:rgba(214,168,90,.07)!important;border-color:rgba(214,168,90,.5)!important}
input[type=checkbox]::after{box-shadow:none!important}input[type=checkbox]:checked{box-shadow:none!important}
input[type=range]{box-shadow:none!important}input[type=range]::-webkit-slider-thumb{box-shadow:none!important}
.note,.hint{background:rgba(214,168,90,.04)!important;border:1px solid #252f4b!important;border-left:3px solid #d6a85a!important;color:#aab4c9!important}

input[type=text],input[type=number],input[type=search],select,textarea,.inp{background-color:#0b1220!important;border:1px solid #35446b!important;border-radius:9px;color:#f6f3ec}

.drop:hover,.drop.on,.panel.drop:hover{border-color:#f0cf8e!important;background:rgba(214,168,90,.07)!important;box-shadow:none!important}
.drop .big b{color:#f0cf8e!important}
.fm i{color:#f0cf8e;border-color:rgba(214,168,90,.35);background:rgba(214,168,90,.07)}
.t-d{background:linear-gradient(135deg,#1b2a52,#121a2d)!important;border:1px solid #35446b!important;color:#f6f3ec!important}.t-d b{color:#8ec5ff}

.score,.idb,.trk,.bp-tag,.cnt{background:rgba(214,168,90,.14)!important;border-color:rgba(214,168,90,.5)!important;color:#f0cf8e!important;box-shadow:none!important}
.tag{background:#18213a;border-color:#29345a;color:#c9d2e6}.tag:hover{border-color:#d6a85a;color:#f0cf8e}
.bar i,.sb i,.bp-bar i{background:linear-gradient(90deg,#f0cf8e,#d6a85a)!important}
.bd.ok{color:#5ff0b4}.bd.risk{color:#ff9db0}.bd.warn{color:#ffe9b8}
.good{color:#5ff0b4}.warn{color:#ffe9b8}.bad{color:#ff9db0}
::-webkit-scrollbar-thumb{background:#35446b!important;border-radius:9px}::-webkit-scrollbar-thumb:hover{background:#d6a85a!important}

/* ===== v6: calm - no glow/motion, same look on every page ===== */
.card:hover,.btn:hover,.nav button:hover,button.day:hover,.it:hover,.nw:hover{transform:none!important}
.bp-st b,.tile.t-d b{text-shadow:none!important}
.btn.bal{background:rgba(61,220,156,.08)!important;border:1px solid rgba(61,220,156,.4)!important;color:#3ddc9c!important}
`;
const STU=LUX+`
.grid2>div:not(.side){display:flex;flex-direction:column;padding-top:12px}
.grid2>div:not(.side)>.bar{order:-1;position:sticky;top:8px;bottom:auto;margin:0 0 14px;z-index:40;background:linear-gradient(180deg,rgba(18,24,42,.96),rgba(7,11,19,.94));border:1px solid rgba(214,168,90,.28);box-shadow:0 8px 24px rgba(0,0,0,.35);backdrop-filter:blur(14px)}
`;
const TRK=LUX+`
.top,.emb .top{flex-wrap:nowrap;gap:10px;padding:8px 16px}
.top .sp{display:none}
.tsearch{flex:1 1 auto;min-width:0}
.top .sbar{flex-wrap:nowrap;gap:8px;align-items:stretch}
.top .sbar input[type=text]{min-width:90px;min-height:42px;font-size:14px}
.top .sbar .btn{min-height:42px;padding:0 16px}
.top,.emb .top{background:linear-gradient(180deg,rgba(18,24,42,.96),rgba(7,11,19,.94))!important;border-bottom:1px solid rgba(214,168,90,.28)!important;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.prog .bar{position:static;padding:0;border:0;box-shadow:none;background:#1a2339;border-radius:9px;backdrop-filter:none}
.mthumb{background:linear-gradient(135deg,#f6dca0,#d6a85a)!important;box-shadow:0 3px 12px rgba(214,168,90,.3)!important}
.top .modesw{flex:0 0 auto;min-width:0;border-color:#35446b;background:#0b1220;box-shadow:none}
.top .modesw button{padding:5px 12px}
.top .modesw button b{font-size:12.5px}
.top .modesw button small{display:none}
.top .modesw svg{width:16px;height:16px}
#mhint,.mhint{display:none!important}
.top .btn,.top .modesw,.top .sbar input[type=text],.top .sbar .btn{height:44px;min-height:44px}
.top .modesw{padding:3px}
.top .sbar{align-items:center}
.top .pchip{padding:4px 14px}
main{padding-top:14px}
.panel .adv{margin-top:0}
@media(max-width:1180px){.top,.emb .top{flex-wrap:wrap}.tsearch{flex:1 1 100%;order:3}.top .sbar{flex-wrap:wrap}.top .modesw{flex:1 1 100%}}
`;
function tweak(app,d){
  const st=d.createElement('style');st.textContent=app==='tracker'?TRK:STU;d.head.appendChild(st);
  if(app!=='tracker')return;
  const top=d.querySelector('.top'),sb=d.querySelector('.sbar'),mh=d.getElementById('mhint'),sp=top&&top.querySelector('.sp');
  if(!top||!sb||!mh||!sp)return;
  const w=d.createElement('div');w.className='tsearch';w.appendChild(sb);top.insertBefore(w,sp);
}
const frames={},ready={};let cur=null;
function win(app){return frames[app]&&frames[app].contentWindow}
function ensure(app){
  if(frames[app]||app==='events')return;
  const box=document.getElementById('v-'+app),f=document.createElement('iframe');
  f.title=app==='tracker'?'Advance Microstock Tracker':'Advance Microstock Image Studio';
  f.onload=()=>{try{const st=f.contentDocument.createElement('style');st.textContent=SCI;f.contentDocument.head.appendChild(st);tweak(app,f.contentDocument)}catch(e){}ready[app]=true;const l=box.querySelector('.ld');if(l)l.remove();if(cur&&TABS[cur].app===app)applyTab(cur)};
  f.srcdoc=APPS[app];box.appendChild(f);frames[app]=f;
}
function applyTab(v){const t=TABS[v];if(t.tab){try{win(t.app).setTab(t.tab)}catch(e){}}}
function show(v,push){
  if(!TABS[v])v='tracker';
  const t=TABS[v];cur=v;ensure(t.app);
  document.getElementById('v-tracker').hidden=t.app!=='tracker';
  document.getElementById('v-studio').hidden=t.app!=='studio';
  document.getElementById('v-events').hidden=t.app!=='events';
  if(t.app==='events'&&window.renderEvents)renderEvents();
  ORDER.forEach(k=>{const b=document.getElementById('t-'+k);b.setAttribute('aria-selected',k===v);b.tabIndex=k===v?0:-1});
  document.title='Advance Microstock · '+t.title;
  if(ready[t.app])applyTab(v);
  try{localStorage.setItem('ams_hub_view',v)}catch(e){}
  if(push&&location.hash!=='#'+v)history.replaceState(null,'','#'+v);
}
document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(b)show(b.dataset.v,true)});
document.querySelector('.nav').addEventListener('keydown',e=>{
  const i=ORDER.indexOf(cur);let n=-1;
  if(e.key==='ArrowRight')n=(i+1)%ORDER.length;else if(e.key==='ArrowLeft')n=(i+ORDER.length-1)%ORDER.length;
  if(n>=0){e.preventDefault();show(ORDER[n],true);document.getElementById('t-'+ORDER[n]).focus()}
});
window.addEventListener('keydown',e=>{if(e.altKey&&!e.ctrlKey&&!e.metaKey&&e.key>='1'&&e.key<='4'){e.preventDefault();show(ORDER[+e.key-1],true)}});
window.addEventListener('hashchange',()=>show(location.hash.slice(1),false));
/* files dropped or pasted on the top bar go to the tool that is open */
const files=dt=>[...(dt&&dt.files||[])];
function forward(fl){if(!fl.length||!cur)return;const t=TABS[cur],w=win(t.app);if(!w)return;
  try{if(t.app==='studio')(t.tab==='C'?w.addC:w.addM)(fl);else if(w.importFile)w.importFile(fl[0])}catch(e){}}
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{e.preventDefault();forward(files(e.dataTransfer))});
window.addEventListener('paste',e=>forward(files(e.clipboardData)));
let start='tracker';
try{start=location.hash.slice(1)||'tracker'}catch(e){start=location.hash.slice(1)||'tracker'}
show(start,!!location.hash);
</script></body></html>
