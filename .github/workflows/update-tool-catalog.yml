name: Refresh tool catalog

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - '*.htm'
      - '.github/workflows/update-tool-catalog.yml'
      - 'advance-microstock- Whisk - Flow Automation 5.3.0/advance-microstock-automator/**'
      - 'Advance Microstock Whisk Flow Automation 5.3.0 - Installation Guide.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Refresh HTML tool catalog and package Chrome extension
        run: |
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          # Refresh the list of HTML tools for the homepage.
          files = sorted(
              path.name
              for path in Path(".").iterdir()
              if path.is_file()
              and path.suffix.lower() in {".html", ".htm"}
              and path.name.lower() != "index.html"
          )
          Path("tool-manifest.json").write_text(
              json.dumps({"files": files}, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          # Package the Chrome extension so manifest.json is at the ZIP root.
          extension_dir = Path(
              "advance-microstock- Whisk - Flow Automation 5.3.0/advance-microstock-automator"
          )
          guide = Path(
              "Advance Microstock Whisk Flow Automation 5.3.0 - Installation Guide.txt"
          )
          zip_path = Path("Advance Microstock Whisk Flow Automation 5.3.0.zip")

          if not extension_dir.is_dir():
              raise SystemExit(f"Extension folder not found: {extension_dir}")
          if not (extension_dir / "manifest.json").is_file():
              raise SystemExit("manifest.json is missing from the extension folder.")
          if not guide.is_file():
              raise SystemExit(f"Installation guide not found: {guide}")

          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(extension_dir.iterdir()):
                  if path.is_file():
                      archive.write(path, arcname=path.name)
              archive.write(guide, arcname="INSTALLATION GUIDE.txt")
          PY

      - name: Commit catalog and extension package when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tool-manifest.json "Advance Microstock Whisk Flow Automation 5.3.0.zip"
          if git diff --cached --quiet; then
            echo "Tool catalog and extension package are already up to date."
          else
            git commit -m "chore: refresh tool catalog and extension package"
            git push origin HEAD:main
          fi
