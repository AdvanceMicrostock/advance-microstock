name: Refresh tool catalog

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - '*.htm'
      - '.github/workflows/update-tool-catalog.yml'
      - 'advance-microstock-*/advance-microstock-automator/**'
      - 'Advance Microstock Whisk Flow Automation - Installation Guide.txt'
      - 'Advance Microstock Metadata Embedder/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Refresh HTML tool catalog and package latest Chrome extension
        run: |
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          # Refresh the list of HTML tools for the homepage.
          files = sorted(
              path.name
              for path in Path(".").iterdir()
              if path.is_file()
              and path.suffix.lower() in {".html", ".htm"}
              and path.name.lower() != "index.html"
          )
          Path("tool-manifest.json").write_text(
              json.dumps({"files": files}, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          # Find the newest unpacked Chrome extension by manifest version.
          candidates = [
              path for path in Path(".").glob("advance-microstock-*/advance-microstock-automator")
              if (path / "manifest.json").is_file()
          ]
          if not candidates:
              raise SystemExit("No Chrome extension folder with manifest.json was found.")

          def version_key(folder):
              data = json.loads((folder / "manifest.json").read_text(encoding="utf-8"))
              try:
                  return tuple(int(part) for part in str(data.get("version", "0")).split("."))
              except ValueError:
                  return (0,)

          extension_dir = max(candidates, key=version_key)
          guide = Path("Advance Microstock Whisk Flow Automation - Installation Guide.txt")
          zip_path = Path("Advance Microstock Whisk Flow Automation.zip")

          if not guide.is_file():
              raise SystemExit(f"Installation guide not found: {guide}")

          # Keep manifest.json and all extension files directly at the ZIP root.
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(extension_dir.iterdir()):
                  if path.is_file():
                      archive.write(path, arcname=path.name)
              archive.write(guide, arcname="INSTALLATION GUIDE.txt")

          # Package the complete Windows Metadata Embedder folder, including README.txt.
          embedder_dir = Path("Advance Microstock Metadata Embedder")
          if not embedder_dir.is_dir():
              raise SystemExit(f"Metadata Embedder folder not found: {embedder_dir}")

          embedder_zip = Path("Advance Microstock Metadata Embedder.zip")
          with zipfile.ZipFile(embedder_zip, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(embedder_dir.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=path.relative_to(embedder_dir.parent))

          # Remove the earlier version-specific package and guide.
          Path("Advance Microstock Whisk Flow Automation 5.3.0.zip").unlink(missing_ok=True)
          Path("Advance Microstock Whisk Flow Automation 5.3.0 - Installation Guide.txt").unlink(missing_ok=True)
          print(f"Packaged extension version from: {extension_dir}")
          print(f"Packaged Metadata Embedder folder: {embedder_dir}")
          PY

      - name: Commit catalog and extension package when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tool catalog and extension package are already up to date."
          else
            git commit -m "chore: refresh tool catalog and latest extension package"
            git push origin HEAD:main
          fi
