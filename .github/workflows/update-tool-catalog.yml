name: Refresh tool catalog

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - '*.htm'
      - '.github/workflows/update-tool-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate catalog from current HTML files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(
              path.name
              for path in Path(".").iterdir()
              if path.is_file()
              and path.suffix.lower() in {".html", ".htm"}
              and path.name.lower() != "index.html"
          )

          catalog = {"files": files}
          Path("tool-manifest.json").write_text(
              json.dumps(catalog, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Commit catalog when it changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tool-manifest.json
          if git diff --cached --quiet; then
            echo "Tool catalog is already up to date."
          else
            git commit -m "chore: refresh tool catalog"
            git push origin HEAD:main
          fi
